<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별똥이의 은하 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 검정 우주 배경을 요청받아 밝은/어두운 모드 모두 같은 우주 팔레트를 씁니다 */
:root{
  --bg:#05050f; --panel:rgba(24,22,52,.86); --panel2:rgba(255,255,255,.07); --ink:#f7f4ff; --muted:#bdb6e3; --line:rgba(195,181,255,.32);
  --pink:#ff9ec7; --mint:#8ff0cf; --lemon:#ffe27a; --lav:#c3b5ff; --sky:#8fd0ff; --peach:#ffb98a; --bad:#ff7d9c;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05050f;--panel:rgba(24,22,52,.86);--ink:#f7f4ff;--muted:#bdb6e3}}
:root[data-theme="dark"]{--bg:#05050f;--panel:rgba(24,22,52,.86);--ink:#f7f4ff;--muted:#bdb6e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
b,strong{color:var(--lemon);font-weight:700}

/* ---------- 우주 배경 ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.planets{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pl{position:absolute;border-radius:50%;animation:bob var(--d,9s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-12px) rotate(-4deg)}to{transform:translateY(14px) rotate(5deg)}}
.p1{width:92px;height:92px;top:12%;right:-14px;background:radial-gradient(circle at 32% 30%,#ffd3e6,#ff8fbf 60%,#c75e98);--d:8s}
.p1::after{content:"";position:absolute;left:-30px;top:36px;width:152px;height:22px;border-radius:50%;border:5px solid #ffe27a;transform:rotate(-16deg);opacity:.9}
.p2{width:64px;height:64px;bottom:14%;left:-8px;background:radial-gradient(circle at 35% 30%,#d6fff1,#8ff0cf 60%,#3fb59a);--d:10s}
.p2::before,.p2::after{content:"";position:absolute;top:26px;width:6px;height:8px;border-radius:50%;background:#20334a}
.p2::before{left:20px}.p2::after{left:36px}
.p3{width:170px;height:170px;bottom:-60px;right:-50px;background:radial-gradient(circle at 30% 28%,#e7e0ff,#a99bff 55%,#6a58c9);opacity:.55;--d:12s}
.p4{width:26px;height:26px;top:26%;left:5%;background:radial-gradient(circle at 35% 30%,#fff7cf,#ffe27a 60%,#d9a93a);--d:6s}
.p5{width:46px;height:46px;top:58%;right:6%;background:radial-gradient(circle at 35% 30%,#ffe2cf,#ffb98a 60%,#d9774b);--d:11s}
.p5::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(150,70,40,.35);top:12px;left:24px;box-shadow:-12px 14px 0 -2px rgba(150,70,40,.3)}
.p6{width:16px;height:16px;top:72%;left:12%;background:#8fd0ff;box-shadow:0 0 14px #8fd0ff;--d:7s}
@media (max-width:640px){.planets{opacity:.55}.p3{width:120px;height:120px}}

/* ---------- 상단 바 ---------- */
.hud{position:sticky;top:0;z-index:20;background:rgba(5,5,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hud-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px}
.logo{font-family:var(--display);font-size:18px;margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chap{display:flex;gap:5px}
.chap i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.15);display:block}
.chap i.on{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.chap i.now{background:var(--lemon);box-shadow:0 0 8px var(--lemon)}
.dust{font-family:var(--display);font-size:18px;color:var(--lemon);background:rgba(255,226,122,.12);border:1px solid rgba(255,226,122,.4);border-radius:999px;padding:3px 12px;white-space:nowrap}
.dust.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:19px;display:grid;place-items:center}
@media (max-width:480px){.logo span{display:none}.chap i{width:11px;height:11px}}

main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 14px 70px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:26px;padding:22px 18px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0 0 10px}
h1{font-size:clamp(36px,9vw,56px)}
h2{font-size:clamp(23px,5.4vw,30px)}
h3{font-size:20px}
p{margin:0 0 12px}
.tag{font-family:var(--display);color:var(--pink);font-size:15px;margin-bottom:2px}
.sub{color:var(--muted);font-size:15px}

/* ---------- 별똥이 ---------- */
.star-char{display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.talk{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px}
.bubble{position:relative;background:#fff;color:#2b2550;border-radius:22px;padding:16px 18px;font-family:var(--display);font-size:20px;line-height:1.55;max-width:560px;width:100%;min-height:92px;text-align:left}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble b{color:#d4458a}
.who{font-family:var(--display);color:var(--lemon);font-size:15px}
.mini{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.mini .bubble{font-size:17px;min-height:0;padding:10px 14px}
.mini .bubble::before{top:16px;left:-11px;margin:0;border:11px solid transparent;border-left:0;border-right-color:#fff}

/* ---------- 버튼 ---------- */
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 24px;font-family:var(--display);font-size:19px;cursor:pointer;background:var(--lemon);color:#2b2550;box-shadow:0 4px 0 #c9a63c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a63c}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c46a95}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);box-shadow:none;font-size:16px;padding:9px 16px}
.btn.big{font-size:22px;padding:14px 32px}
.choices{display:grid;gap:10px;width:100%;max-width:560px}

/* ---------- 문제 ---------- */
.q{font-family:var(--display);font-size:22px;line-height:1.45;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px 14px;cursor:pointer;line-height:1.5;display:flex;gap:10px;align-items:flex-start;transition:transform .15s}
.opt:hover:not(:disabled){border-color:var(--lemon);transform:translateY(-2px)}
.opt .n{font-family:var(--display);color:var(--pink)}
.opt.ok{border-color:var(--mint);background:rgba(143,240,207,.15)}
.opt.bad{border-color:var(--bad);background:rgba(255,125,156,.12);opacity:.7}
.opt:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox .opt{justify-content:center;font-family:var(--display);font-size:50px;padding:10px}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(143,240,207,.13);border:1.5px solid var(--mint)}
.fb.bad{background:rgba(255,125,156,.12);border:1.5px solid var(--bad)}
.fb .t{font-family:var(--display);font-size:19px;display:block}
.fb.ok .t{color:var(--mint)}
.fb.bad .t{color:var(--bad)}
.hintbox{margin-top:12px;font-size:15px;color:var(--muted);display:none;border:1.5px dashed var(--line);padding:10px 12px;border-radius:14px}
.hintbox.show{display:block}
figure{margin:12px 0}
figure img{border-radius:16px;width:100%}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.note{border-left:4px solid var(--sky);padding:8px 12px;background:var(--panel2);border-radius:0 12px 12px 0;font-size:15px;margin:12px 0}

/* 보상 효과 */
.pop-txt{position:fixed;z-index:60;font-family:var(--display);font-size:24px;color:var(--lemon);pointer-events:none;animation:rise 1s ease-out forwards;text-shadow:0 0 10px rgba(255,226,122,.6)}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;z-index:59;width:9px;height:9px;pointer-events:none;border-radius:2px;animation:conf .9s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#fff;color:#2b2550;border-radius:18px;padding:10px 16px;font-family:var(--display);font-size:16px;max-width:min(92vw,520px);box-shadow:0 6px 30px rgba(0,0,0,.5);display:none;text-align:center}
.toast.show{display:block;animation:tin .3s}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.shoot{position:fixed;z-index:15;width:56px;height:56px;border:0;background:none;cursor:pointer;padding:0;animation:fly 3.2s linear forwards}
.shoot::after{content:"";position:absolute;right:30px;top:24px;width:90px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff7cf);transform-origin:right center;transform:rotate(-28deg)}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}

/* ---------- 체험 요소 ---------- */
.spin-wrap{perspective:900px;padding:20px 0;display:grid;place-items:center;min-height:300px}
.spin-wrap img{width:min(100%,460px);border-radius:50%;transition:transform .15s;box-shadow:0 0 40px rgba(195,181,255,.35)}
input[type=range]{width:100%;accent-color:var(--pink);height:32px}
.state-msg{min-height:58px;text-align:center;font-family:var(--display);font-size:19px}
.map{position:relative;border-radius:18px;overflow:hidden;cursor:crosshair;touch-action:manipulation}
.map img{width:100%}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:30px;pointer-events:none;filter:drop-shadow(0 2px 3px #000)}
.pin.old{opacity:.45;font-size:22px}
.scope{position:relative;border-radius:18px;overflow:hidden;touch-action:none;cursor:none;user-select:none;-webkit-user-select:none}
.scope img{width:100%;pointer-events:none}
.scope .dark{position:absolute;inset:0;background:rgba(2,2,10,.93);-webkit-mask-image:radial-gradient(circle 70px at var(--x,-200px) var(--y,-200px),transparent 96%,#000 100%);mask-image:radial-gradient(circle 70px at var(--x,-200px) var(--y,-200px),transparent 96%,#000 100%);pointer-events:none}
.scope.revealed{cursor:default}
.scope .dark{transition:opacity 1.2s}
.scope.revealed .dark{opacity:0}
.scope.revealed .ring{display:none}
.scope .ring{position:absolute;width:148px;height:148px;margin:-74px 0 0 -74px;border:4px solid var(--lemon);border-radius:50%;left:var(--x,-200px);top:var(--y,-200px);pointer-events:none;box-shadow:0 0 0 3px rgba(0,0,0,.5)}
.clue{position:absolute;transform:translate(-50%,-50%);font-size:26px;pointer-events:none;animation:tw 1.2s ease-in-out infinite alternate}
@keyframes tw{to{transform:translate(-50%,-50%) scale(1.3)}}
.clue.found{animation:none;font-size:15px;font-family:var(--display);width:30px;height:30px;border-radius:50%;background:var(--mint);color:#2b2550;display:grid;place-items:center;z-index:3;box-shadow:0 0 0 3px #fff}
.callout{position:absolute;z-index:4;width:min(240px,62%);background:#fff;color:#2b2550;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.55);pointer-events:none;animation:tin2 .25s}
.callout b{color:#d4458a}
.callout .no{font-family:var(--display);color:#12805c;margin-right:4px}
@keyframes tin2{from{opacity:0;transform:scale(.85)}}
.cluelist .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#2b2550;font-family:var(--display);font-size:13px;margin-right:6px}
.cluelist{display:grid;gap:8px;margin-top:12px}
.cluelist div{background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:15px;color:var(--muted)}
.cluelist div.got{color:var(--ink);border:1.5px solid var(--mint)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.seg .opt{justify-content:center;font-family:var(--display);font-size:19px}
.seg .opt.on{border-color:var(--lemon);background:rgba(255,226,122,.14)}
svg.scene{width:100%;height:auto;background:rgba(255,255,255,.04);border-radius:16px;display:block}
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.flips{grid-template-columns:1fr}}
.flip{perspective:1000px;height:330px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden;border:2px solid var(--line)}
.flip .f img{width:100%;height:100%;object-fit:cover}
.flip .f span{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(5,5,15,.75);border-radius:12px;padding:6px 10px;font-family:var(--display);font-size:20px}
.flip .b{transform:rotateY(180deg);background:#211d4a;padding:14px;font-size:15px;line-height:1.6;overflow:auto}
.flip .b h3{color:var(--lemon)}
.flip .b dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.flip .b dt{color:var(--muted)} .flip .b dd{margin:0}
canvas.make{width:100%;height:auto;background:#020208;border-radius:16px;display:block}
.sortcard{min-height:120px;display:grid;place-items:center;text-align:center;background:var(--panel2);border:2px solid var(--line);border-radius:20px;padding:18px;font-family:var(--display);font-size:23px;line-height:1.4}
.sortcard.img{padding:0;overflow:hidden;min-height:0}
.sortcard.img img{width:100%;max-height:320px;object-fit:cover}
.sortcard.ok{border-color:var(--mint)}
.bins{display:grid;gap:10px;margin-top:12px}
.bins.b2{grid-template-columns:1fr 1fr}.bins.b3{grid-template-columns:1fr 1fr 1fr}
.bin{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px 6px;font-family:var(--display);font-size:18px;cursor:pointer}
.bin:hover:not(:disabled){border-color:var(--lemon)}
.bin.c0{border-color:rgba(143,208,255,.6)}.bin.c1{border-color:rgba(255,185,138,.6)}.bin.c2{border-color:rgba(195,181,255,.6)}
.count{font-size:14px;color:var(--muted);text-align:center;margin-bottom:6px}
.caption{min-height:28px;text-align:center;font-size:15px;margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
.timer{height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--lemon),var(--pink));transition:width .25s linear}
.score{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px}
.fillrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.fillrow .lab{min-width:140px;color:var(--muted)}
.blank{min-width:96px;min-height:42px;border:2px dashed var(--lemon);border-radius:12px;background:transparent;font-family:var(--display);font-size:20px;cursor:pointer;padding:2px 10px}
.blank.active{background:rgba(255,226,122,.15);border-style:solid}
.blank.ok{border-color:var(--mint);border-style:solid}
.blank.bad{border-color:var(--bad);border-style:solid}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 16px;font-family:var(--display);font-size:20px;cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start}
.check .box{flex:0 0 24px;height:24px;border:2px solid var(--muted);border-radius:7px;margin-top:2px;display:grid;place-items:center;font-size:15px}
.opt.sel{border-color:var(--lemon);background:rgba(255,226,122,.12)}
.opt.sel .box{border-color:var(--lemon);background:var(--lemon);color:#2b2550}

/* 챕터 표지, 스티커 */
.cover{text-align:center;padding:30px 18px}
.cover .num{font-family:var(--display);color:var(--pink);font-size:18px}
.pack{width:170px;height:200px;margin:14px auto;border-radius:22px;border:0;cursor:pointer;background:linear-gradient(150deg,#ff9ec7,#c3b5ff 55%,#8fd0ff);font-family:var(--display);font-size:22px;color:#2b2550;box-shadow:0 8px 0 #7d6cc9,0 0 40px rgba(255,158,199,.4);animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px}
.stk{background:#fff;color:#2b2550;border-radius:18px;padding:8px;text-align:center;font-family:var(--display);font-size:15px;line-height:1.3;transform:rotate(var(--rot,0deg))}
.stk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid var(--c,#ff9ec7);margin-bottom:6px}
.stk.locked{background:rgba(255,255,255,.08);color:var(--muted)}
.stk.locked .ph{width:100%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:34px;margin-bottom:6px}
.stk.new{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.1) rotate(-30deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,3,12,.82);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.modal.show{display:flex}
.modal .card{max-width:720px;width:100%}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.item{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:10px;cursor:pointer;text-align:center;font-family:var(--display)}
.item .ic{font-size:30px}
.item small{display:block;font-family:var(--body);color:var(--muted)}
.item.own{border-color:var(--mint)}
.item.eq{border-color:var(--lemon);background:rgba(255,226,122,.12)}
.item:disabled{opacity:.5;cursor:default}
.box-item{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0 12px;justify-content:center;flex-wrap:wrap;background:linear-gradient(120deg,rgba(255,158,199,.25),rgba(195,181,255,.25),rgba(143,208,255,.25));font-size:18px}
.box-item .ic{font-size:26px}
.box-item small{flex-basis:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-family:var(--display);font-size:16px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--pink);color:#2b2550;border-color:var(--pink)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kgrid figure{margin:6px 0}.kgrid img{aspect-ratio:4/3;object-fit:cover}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14px;line-height:1.5}
.cmp div{background:var(--panel2);border-radius:14px;padding:10px;text-align:center}
.cmp div:nth-child(2){border:2px solid var(--sky)}
@media (max-width:480px){.cmp{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--panel2);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:400}
.stat span{font-size:13px;color:var(--muted)}
input.name{font:inherit;width:100%;max-width:280px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="dust" id="dust" aria-label="별가루">✨ 0</div>
  <button class="hbtn" id="bookBtn" aria-label="스티커북 열기">📒</button>
  <button class="hbtn" id="shopBtn" aria-label="별똥이 꾸미기">🎀</button>
</div></div>
<main id="stage" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>

/* 말풍선 대화 */
function talk(lines,{choices,onDone,title}={}){
  let i=0, typing=null;
  stage().innerHTML=`<div class="card">${title?`<div class="tag" style="text-align:center">${title}</div>`:''}
    <div class="talk"><div id="tc"></div><div class="bubble" id="tb"></div><div class="who">별똥이</div><div id="tctl" class="choices"></div></div></div>`;
  const show=()=>{
    const L=lines[i]; $('#tc').innerHTML=star(L.m,140);
    const full=L.t.replace(/\{name\}/g,S.name||'친구');
    const tb=$('#tb'); clearInterval(typing);
    const plain=full.replace(/<[^>]+>/g,'');
    if(RM){tb.innerHTML=full;ctl();return;}
    let n=0; tb.textContent='';
    typing=setInterval(()=>{n+=2;tb.textContent=plain.slice(0,n);if(n>=plain.length){clearInterval(typing);typing=null;tb.innerHTML=full;ctl();}},28);
    tb.onclick=()=>{if(typing){clearInterval(typing);typing=null;tb.innerHTML=full;ctl();}};
    $('#tctl').innerHTML='';
  };
  const ctl=()=>{
    const last=i===lines.length-1;
    if(last&&choices){
      $('#tctl').innerHTML=choices.map((c,k)=>`<button class="btn ${k?'pink':''}" data-k="${k}">${c.t}</button>`).join('');
      $$('#tctl .btn').forEach(b=>b.onclick=()=>choices[+b.dataset.k].go());
    }else{
      $('#tctl').innerHTML=`<button class="btn" id="tn">${last?'계속 ▶':'다음 ▶'}</button>`;
      $('#tn').onclick=()=>{if(last)onDone();else{i++;show();}};
      $('#tn').focus({preventScroll:true});
    }
  };
  cleanups.push(()=>clearInterval(typing));
  show();
}

  S.pos='prologue';
  go(()=>talk([

    {m:'happy2',t:'안녕, {name}! 나는 은하수에 사는 꼬마 별 <b>별똥이</b>야.'},
    {m:'sad',t:'친구들이 그러는데, 은하수가 <b>우주의 중심</b>이래. 그런데 난 잘 모르겠어… 은하수는 정말 우주의 중심일까?'},
    {m:'happy',t:'나랑 같이 우주 여행을 떠나서 알아보지 않을래?'}],

      {t:'조금 무섭지만… 가 볼게!',go:()=>{addDust(5,null,'용기');go(()=>talk([{m:'happy',t:'괜찮아, 내가 옆에 꼭 붙어 있을게! 용기 선물로 별가루를 줄게.'}],{onDone:()=>chapterCover(0)}));}}
    ]}));
}

function chapterCover(c){
  S.c=c;S.s=0;S.pos='cover';
  go(()=>{
    const ch=CH[c];
    stage().innerHTML=`<div class="card cover"><div class="num">${c+1}장</div>
      <div style="font-size:64px;line-height:1.2;margin:8px 0">${ch.emoji}</div>
      <h2>${ch.title}</h2>
      <button class="btn big" id="go" style="margin-top:12px">이야기 시작</button></div>`;
    $('#go').onclick=()=>scene();
  });
}

function scene(){
  const ch=CH[S.c];
  if(S.s>=ch.scenes.length){chapterEnd();return;}
  const sc=ch.scenes[S.s];
  S.pos='scene';S.cleared=false;
  go(()=>{
    if(sc.type==='talk'){talk(sc.lines,{title:`${S.c+1}장 · ${ch.title}`,onDone:next});return;}
    R[sc.type](sc);
  });
}
function next(){S.s++;scene();}

function frame(inner,nextLabel='다음 ▶',hint){
  const ch=CH[S.c], n=ch.scenes.length;
  return `<div class="card"><div class="tag">${S.c+1}장 · ${ch.title} <span class="sub">(${S.s+1}/${n})</span></div>${inner}
   ${hint?`<div class="hintbox" id="hintbox">💡 ${hint}</div>`:''}
   <div class="fb" id="fb"></div>
   <div class="row">${hint?'<button class="btn ghost" id="hintBtn">힌트 보기</button>':'<span></span>'}<button class="btn" id="next" disabled>${nextLabel}</button></div></div>`;
}
function wire(){
  const hb=$('#hintBtn'); if(hb)hb.onclick=()=>{$('#hintbox').classList.add('show');hb.disabled=true;};
  $('#next').onclick=next;
}
function fb(ok,html){const f=$('#fb');f.className='fb show '+(ok?'ok':'bad');f.innerHTML=`<span class="t">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'앗, 다시 생각해 볼까?'}</span>${html}`;}
function unlock(){S.cleared=true;save();const n=$('#next');n.disabled=false;n.focus({preventScroll:true});}

const R={};

R.mc=st=>{
  let tried=false;

    else{tried=true;S.combo=0;b.classList.add('bad');b.disabled=true;fb(false,'다른 답을 골라 봐. 힌트를 봐도 좋아!');}

R.ox=st=>{
  stage().innerHTML=frame(`${mini('O일까, X일까?','wow')}<p class="q">${st.q}</p>
    <div class="ox"><button class="opt" data-v="1" aria-label="O 맞다">⭕</button><button class="opt" data-v="0" aria-label="X 틀리다">❌</button></div>`);
  wire();

    $$('.ox .opt').forEach(x=>{x.disabled=true;if((x.dataset.v==='1')===st.a)x.classList.add('ok');});

R.fill=st=>{
  let tried=false,active=0;const val=st.rows.map(()=>null);
  stage().innerHTML=frame(`<p class="q">${st.q}</p>
    <div style="background:#fff;color:#2b2550;border-radius:18px;padding:12px 16px">
      <div style="display:flex;align-items:center;gap:10px;border-bottom:2px solid #eee;padding-bottom:8px">${star('happy2',46)}<b style="color:#d4458a;font-family:var(--display);font-size:20px">우리은하 신분증</b></div>
      ${st.rows.map((r,i)=>`<div class="fillrow" style="border-color:#ddd"><span class="lab" style="color:#6b6590">${r.lab}</span><span>${r.pre}</span><button class="blank" data-i="${i}" style="color:#2b2550" aria-label="${r.lab} 빈칸">&nbsp;</button><span>${r.post}</span></div>`).join('')}
    </div>
    <div class="tiles">${shuffle(st.tiles).map(t=>`<button class="tile">${t}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><span></span><button class="btn pink" id="chk">확인하기</button></div>`,'다음 ▶',st.hint);
  wire();
  const blanks=$$('.blank');
  const paint=()=>blanks.forEach((b,i)=>{b.classList.toggle('active',i===active);b.innerHTML=val[i]??'&nbsp;';});
  paint();
  blanks.forEach(b=>b.onclick=()=>{active=+b.dataset.i;b.classList.remove('bad');paint();});
  $$('.tile').forEach(t=>t.onclick=()=>{if(active<0)active=0;val[active]=t.textContent;blanks[active].classList.remove('bad');active=val.findIndex(v=>v===null);paint();});
  $('#chk').onclick=()=>{
    if(val.some(v=>v===null)){fb(false,'빈칸을 모두 채워 줘!');return;}
    let all=true;blanks.forEach((b,i)=>{const ok=val[i]===st.rows[i].a;b.classList.toggle('ok',ok);b.classList.toggle('bad',!ok);if(!ok)all=false;});
    if(all){blanks.forEach(b=>b.disabled=true);$$('.tile').forEach(t=>t.disabled=true);$('#chk').disabled=true;rightAnswer($('#chk'),!tried);fb(true,st.exp);unlock();}
    else{tried=true;S.combo=0;fb(false,'빨간 칸이 틀렸어. 눌러서 다시 채워 봐.');active=blanks.findIndex(b=>b.classList.contains('bad'));paint();}
  };
};

R.sort=st=>{
  const items=shuffle(st.items);let k=0,tried=false,timer;
  stage().innerHTML=frame(`<p class="q">${st.q}</p><div class="count" id="cnt"></div><div id="sc"></div><div class="caption" id="cap"></div>
    <div class="bins b${st.bins.length}">${st.bins.map((b,i)=>`<button class="bin c${i}" data-i="${i}">${b}</button>`).join('')}</div>`);
  wire();
  const show=()=>{const it=items[k];tried=false;$('#cnt').textContent=`${k+1} / ${items.length}`;$('#cap').textContent='';
    $('#sc').innerHTML=it.img?`<div class="sortcard img"><img src="${IMG[it.img]}" alt="분류할 천체 사진"></div>`:`<div class="sortcard">${it.t}</div>`;
    $$('.bin').forEach(b=>b.disabled=false);};
  show();
  $$('.bin').forEach(b=>b.onclick=()=>{
    const it=items[k],i=+b.dataset.i;
    if(i===it.b){$$('.bin').forEach(x=>x.disabled=true);$('#sc .sortcard').classList.add('ok');rightAnswer(b,!tried);
      $('#cap').innerHTML=`<span style="color:var(--mint)">✔ ${st.bins[i]}</span>${it.name?' · '+it.name:''}`;k++;
      if(k<items.length)timer=setTimeout(show,1300);else{fb(true,'모든 사진을 감별했어!');unlock();}}
    else{tried=true;S.combo=0;const c=$('#sc .sortcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
      $('#cap').innerHTML=`<span style="color:var(--bad)">${st.bins[i]}이(가) 아니야.</span> ${st.why[it.b]}`;}
  });
  cleanups.push(()=>clearTimeout(timer));
};

/* 1장: 태양계 집 찾기 */
R.home=()=>{
  let tried=false,doneF=false;
  stage().innerHTML=frame(`${mini('은하 지도를 눌러서 별똥이네 집(태양계)을 찾아 줘! 누른 곳이 중심에서 얼마나 떨어졌는지 알려 줄게.','sad')}
    <div class="map" id="map"><img src="${IMG.top}" alt="위에서 본 우리은하 지도. 눌러서 위치를 고르세요"></div>
    <div class="state-msg" id="sm" style="margin-top:10px">지도 아무 곳이나 눌러 봐!</div>`,'다음 ▶','태양계는 중심에서 약 8500 pc! 우리은하 반지름이 약 15000 pc니까, 중심에서 가장자리까지의 절반을 조금 넘는 곳이야.');
  wire();
  const map=$('#map');
  map.onclick=e=>{
    if(doneF)return;
    const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    const cx=r.width*.50,cy=r.height*.44,R=r.width*.43;
    const pc=Math.round(Math.hypot(x-cx,y-cy)/R*15000/100)*100;
    $$('.pin').forEach(p=>p.classList.add('old'));
    const p=document.createElement('div');p.className='pin';p.textContent='📍';p.style.left=x+'px';p.style.top=y+'px';map.appendChild(p);
    let m;
    if(pc>=6800&&pc<=10200){
      doneF=true;p.textContent='🏠';
      m=`🎉 찾았다! 중심에서 약 <b>${pc.toLocaleString()} pc</b>, 나선팔 위야. 진짜 태양계는 약 8500 pc에 있어!`;
      const s=document.createElement('div');s.className='pin';s.textContent='☀️';s.style.left=(r.width*.25)+'px';s.style.top=(r.height*.44+14)+'px';map.appendChild(s);
      rightAnswer(map,!tried);unlock();
    } else {
      tried=true;S.combo=0;
      m = pc<3000?`중심에서 약 ${pc.toLocaleString()} pc. 여긴 은하 중심부! 별이 너무 빽빽해서 눈부셔 😵 좀 더 바깥으로!`
        : pc<6800?`중심에서 약 ${pc.toLocaleString()} pc. 조금만 더 바깥쪽으로 가 볼까?`
        : pc<=15000?`중심에서 약 ${pc.toLocaleString()} pc. 너무 바깥이야! 조금 더 안쪽으로!`
        : `중심에서 약 ${pc.toLocaleString()} pc. 앗, 우리은하 밖으로 나가 버렸어! 🚀`;
    }
    $('#sm').innerHTML=m;
  };
};

R.info=st=>{stage().innerHTML=frame(`<h2>${st.title}</h2>${st.html}`,'다 읽었어 ▶');wire();unlock();};
R.scope=()=>{
  const clues=[
    {x:30,y:64,t:'🌟 가장 밝고 넓은 부분! 이쪽이 별이 빽빽한 <b>은하 중심 방향</b>(궁수자리 쪽)이야.'},
    {x:22,y:52,t:'🕳️ 검은 틈! 별이 없는 게 아니라 <b>무언가가 뒤쪽 별빛을 가리고</b> 있어. 정체는 4장에서 밝혀져!'},
    {x:79,y:29,t:'🌫️ 띠가 가늘고 흐려지는 곳! 은하 <b>바깥쪽</b> 방향이라 별이 적어.'},
    {x:50,y:93,t:'⛰️ 지평선의 산! 우리는 <b>지구</b>에서, 우리은하 <b>안</b>에서 올려다보고 있어.'}];
  const got=new Set();
  stage().innerHTML=frame(`${mini('별똥이 망원경으로 어두운 밤하늘을 비춰 봐! 반짝이는 <b>✦ 단서</b>가 보이면 눌러 봐. 찾은 자리에 바로 설명이 나타나! 4개를 모두 찾아 줘.','wow')}
    <div class="scope" id="scope"><img src="${IMG.mw}" alt="밤하늘의 은하수">
      ${clues.map((c,i)=>`<span class="clue" id="cl${i}" style="left:${c.x}%;top:${c.y}%">✦</span>`).join('')}
      <div class="dark"></div><div class="ring"></div></div>
    <p class="note" id="reveal" hidden>🌌 <b>밤하늘 전체 공개!</b> 밝은 중심 방향 ①, 검은 틈 ②, 희미한 바깥쪽 ③, 지평선 ④를 한눈에 비교해 봐. 이 희뿌연 띠 전체가 지구에서 본 우리은하의 일부야.</p>
    <div class="cluelist">${clues.map((c,i)=>`<div id="cd${i}">🔒 단서 ${i+1}: 아직 못 찾았어</div>`).join('')}</div>`,'단서 다 모았어 ▶');
  wire();
  const sc=$('#scope');
  const mv=e=>{const r=sc.getBoundingClientRect();sc.style.setProperty('--x',(e.clientX-r.left)+'px');sc.style.setProperty('--y',(e.clientY-r.top)+'px');};
  sc.addEventListener('pointermove',mv);
  sc.addEventListener('pointerdown',e=>{
    mv(e);const r=sc.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    clues.forEach((c,i)=>{
      if(got.has(i))return;
      if(Math.hypot(x-r.width*c.x/100,y-r.height*c.y/100)<46){
        got.add(i);const cl=$('#cl'+i);cl.classList.add('found');cl.textContent=i+1;
        const d=$('#cd'+i);d.classList.add('got');d.innerHTML=`<span class="no">${i+1}</span>`+c.t;
        sc.querySelectorAll('.callout').forEach(o=>o.remove());
        const co=document.createElement('div');co.className='callout';co.innerHTML=`<span class="no">${i+1}</span>${c.t}`;
        sc.appendChild(co);
        const cx=r.width*c.x/100, cy=r.height*c.y/100, w=co.offsetWidth, h=co.offsetHeight;
        let lx=Math.min(Math.max(cx-w/2,6),r.width-w-6);
        let ty=c.y>55?cy-h-22:cy+22; ty=Math.min(Math.max(ty,6),r.height-h-6);
        co.style.left=lx+'px';co.style.top=ty+'px';
        addDust(5,cl,'단서');
        if(got.size===clues.length){unlock();setTimeout(()=>{sc.classList.add('revealed');sc.querySelectorAll('.callout').forEach(o=>o.remove());$('#reveal').hidden=false;},1600);toast('🔭 단서를 모두 찾았어! 이제 밤하늘 전체를 볼 수 있어.');}
      }
    });
  });
};

/* 3장: 성단 만들기 */
R.make=()=>{
  const seen=new Set();let raf;
  stage().innerHTML=frame(`${mini('이번엔 직접 성단을 만들어 보자! 버튼을 눌러 별 친구들을 불러 모아 봐.','happy2')}
    <canvas class="make" id="cv" width="640" height="340"></canvas>
    <div class="seg"><button class="opt" id="mo">💙 산개 성단 만들기</button><button class="opt" id="mg">🧡 구상 성단 만들기</button></div>
    <div class="note" id="md">버튼을 눌러 봐!</div>`,'다음 ▶');
  wire();
  const cv=$('#cv'),ctx=cv.getContext('2d');
  const run=type=>{
    cancelAnimationFrame(raf);
    const N=type==='o'?70:1100, stars=[];
    for(let i=0;i<N;i++){
      let tx,ty,col,sz;
      if(type==='o'){tx=60+Math.random()*520;ty=30+Math.random()*280;col=['#bfe6ff','#8fd0ff','#ffffff','#a9c8ff'][i%4];sz=1.5+Math.random()*2.8;}
      else{const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),2.2)*150;tx=320+Math.cos(a)*r;ty=170+Math.sin(a)*r*.95;col=['#ffd29a','#ffb98a','#ffe9c4','#ff9a7a'][i%4];sz=.7+Math.random()*1.6;}
      stars.push({x:Math.random()*640,y:Math.random()<.5?-10:350,tx,ty,col,sz});
    }
    let t=0;
    const step=()=>{t=Math.min(1,t+(RM?1:.025));const e=1-Math.pow(1-t,3);
      ctx.fillStyle='#020208';ctx.fillRect(0,0,640,340);
      stars.forEach(s=>{ctx.beginPath();ctx.fillStyle=s.col;ctx.arc(s.x+(s.tx-s.x)*e,s.y+(s.ty-s.y)*e,s.sz,0,7);ctx.fill();});
      if(t<1)raf=requestAnimationFrame(step);};
    step();
    $('#mo').classList.toggle('on',type==='o');$('#mg').classList.toggle('on',type==='g');
    $('#md').innerHTML=type==='o'
      ?'💙 <b>산개 성단</b>: 별 70개가 <b>엉성하게 흩어졌어</b>. 실제로는 수십~수만 개! 젊고 뜨거운 <b>파란</b> 별이 많아.'
      :'🧡 <b>구상 성단</b>: 별 1100개가 <b>빽빽한 공 모양</b>으로 모였어. 실제로는 수만~수십만 개! 나이 많은 <b>붉은</b> 별이 많아.';
    seen.add(type);if(seen.size===2&&$('#next').disabled){unlock();addDust(5,$('#md'),'실험');}
  };
  ctx.fillStyle='#020208';ctx.fillRect(0,0,640,340);
  $('#mo').onclick=()=>run('o');$('#mg').onclick=()=>run('g');
  cleanups.push(()=>cancelAnimationFrame(raf));
};

      <div class="stats">
        <div class="stat"><b>✨ ${S.dust}</b><span>남은 별가루</span></div>
        <div class="stat"><b>📒 ${S.stickers.size}/${STICKERS.length}</b><span>모은 스티커</span></div>
        <div class="stat"><b>${rate}%</b><span>한 번에 맞힌 비율 (${S.first}/${S.total})</span></div>
        <div class="stat"><b>${m}:${String(s).padStart(2,'0')}</b><span>여행 시간</span></div>
      </div>
      <p style="font-family:var(--display);font-size:24px">칭호: <b>${title}</b></p>
      <p class="sub">남은 별가루로 🎀 별똥이를 꾸며서 기념 사진(화면 캡처)을 찍어 봐!</p>
      <div class="row" style="justify-content:center"><button class="btn pink" id="sb">📒 스티커북 보기</button><button class="btn" id="sh">🎀 꾸미기</button><button class="btn ghost" id="again">처음부터 다시</button></div>
    </div>`;
    $('#sb').onclick=openBook;$('#sh').onclick=()=>{openShop();};$('#again').onclick=()=>{clearSave();startScreen();};
    for(let i=0;i<4;i++)setTimeout(()=>confetti(innerWidth*(.2+.2*i),innerHeight*.35),i*250);
  });
}

/* ===================== 반짝이는 별 배경 ===================== */
(function(){
  const cv=$('#sky'),ctx=cv.getContext('2d');let W,H,stars=[];
  const cols=['#ffffff','#fff7cf','#ffd3e6','#cdeaff','#e6dcff'];
  const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6.28,s:.5+Math.random()*1.6,c:cols[Math.floor(Math.random()*5)]}));};
  const draw=t=>{ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=RM?.8:.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s));ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
      if(s.r>1.6){ctx.globalAlpha*=.5;ctx.fillRect(s.x-s.r*3,s.y-.4,s.r*6,.8);ctx.fillRect(s.x-.4,s.y-s.r*3,.8,s.r*6);}});
    ctx.globalAlpha=1; if(!RM)requestAnimationFrame(draw);};
  size();addEventListener('resize',size);requestAnimationFrame(draw);
})();

startScreen();
if(!RM)shootLoop();
</script>
</body>
</html>
